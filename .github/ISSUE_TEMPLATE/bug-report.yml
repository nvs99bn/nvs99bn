name: Report a problem
description: Something on the voyage or a tool is not working.
title: 'Bug: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: '1. Open the voyage...'
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone, etc.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots are welcome. Please omit personal notes and private information.
